name: Group 3 public routing and i18n validation v3

on:
  push:
    branches:
      - fix/group-3-public-routing-i18n

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply corrected Group 3 patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/group-3-public-routing-i18n-v2.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          patch_script = textwrap.dedent(workflow[start:end])
          invalid = "'''.replace(/^          /gm, \"\"))"
          if patch_script.count(invalid) != 1:
              raise SystemExit(f'Expected one invalid V2 test-writer expression, got {patch_script.count(invalid)}')
          patch_script = patch_script.replace(invalid, "''')", 1)
          compile(patch_script, 'group-3-v2-corrected.py', 'exec')
          exec(patch_script, {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Group 3 regression tests
        run: node tests/group-3-public-routing-i18n.test.mjs

      - name: Existing AI tests
        run: npm run test:ai

      - name: Existing ambassador delivery tests
        run: npm run test:ambassador-delivery

      - name: Commit validated fixes and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/group-3-public-routing-i18n.yml
          rm .github/workflows/group-3-public-routing-i18n-v2.yml
          rm .github/workflows/group-3-public-routing-i18n-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/site/use-view-router.ts src/components/site/i18n.tsx src/components/dashboard-i18n-provider.tsx src/app/login/page.tsx src/components/sections/partner-view.tsx src/components/sections/collaboration-application-form.tsx tests/group-3-public-routing-i18n.test.mjs .github/workflows/group-3-public-routing-i18n.yml .github/workflows/group-3-public-routing-i18n-v2.yml .github/workflows/group-3-public-routing-i18n-v3.yml
          git commit -m "fix: close group 3 public routing and language findings"
          git push origin HEAD:fix/group-3-public-routing-i18n
