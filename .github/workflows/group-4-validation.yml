name: Group 4 validation

on:
  push:
    branches:
      - fix/group-4-ai-health-ambassador-layering

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply Group 4 patch
        run: python scripts/group4_patch.py

      - name: Check diff whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Group 4 regression tests
        run: node tests/group-4-ai-health-ambassador-layering.test.mjs

      - name: Existing AI tests
        run: npm run test:ai

      - name: Existing ambassador delivery tests
        run: npm run test:ambassador-delivery

      - name: Commit validated fixes and remove temporary tooling
        shell: bash
        run: |
          rm .github/workflows/group-4-validation.yml
          rm scripts/group4_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai/providers/gemini.ts src/app/api/ai/chat/route.ts src/components/site/ai-assistant.tsx src/components/site/whatsapp-button.tsx src/components/site/scroll-utilities.tsx src/components/site/i18n.tsx src/components/dashboard-i18n-provider.tsx src/app/ambassador/dashboard/page.tsx src/lib/dashboard-i18n.ts tests/group-4-ai-health-ambassador-layering.test.mjs .github/workflows/group-4-validation.yml scripts/group4_patch.py
          git commit -m "fix: close group 4 AI health and dashboard UX findings"
          git push origin HEAD:fix/group-4-ai-health-ambassador-layering
