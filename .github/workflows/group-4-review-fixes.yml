name: Group 4 review fixes validation

on:
  push:
    branches:
      - fix/group-4-ai-health-ambassador-layering

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply CodeRabbit review fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Keep ambassador error state language-neutral; localize only at render time.
          path = "src/app/ambassador/dashboard/page.tsx"
          replacements = [
              ('throw new Error(localizeMessage(dashboardErrorMessage(payload.error, "تعذر تحميل لوحة السفير")));', 'throw new Error(dashboardErrorMessage(payload.error, "تعذر تحميل لوحة السفير"));'),
              ('loadDashboard().catch((cause) => setError(cause instanceof Error ? cause.message : localizeMessage("تعذر تحميل البيانات")));', 'loadDashboard().catch((cause) => setError(cause instanceof Error ? cause.message : "تعذر تحميل البيانات"));'),
              ('setError(localizeMessage("تعذر النسخ تلقائيًا. حدّد النص وانسخه يدويًا."));', 'setError("تعذر النسخ تلقائيًا. حدّد النص وانسخه يدويًا.");'),
              ('setError(localizeMessage("تعذرت المشاركة الآن."));', 'setError("تعذرت المشاركة الآن.");'),
              ('throw new Error(localizeMessage(messages[payload?.error] || dashboardErrorMessage(payload?.error, "تعذر إنشاء الرد")));', 'throw new Error(messages[payload?.error] || dashboardErrorMessage(payload?.error, "تعذر إنشاء الرد"));'),
              ('setError(cause instanceof Error ? cause.message : localizeMessage("تعذر إنشاء الرد"));', 'setError(cause instanceof Error ? cause.message : "تعذر إنشاء الرد");'),
              ('throw new Error(localizeMessage(message));', 'throw new Error(message);'),
              ('setError(cause instanceof Error ? cause.message : localizeMessage("تعذر إضافة الإحالة"));', 'setError(cause instanceof Error ? cause.message : "تعذر إضافة الإحالة");'),
              ('if (!response.ok) throw new Error(localizeMessage(dashboardErrorMessage(payload.error, "تعذر حفظ الملف")));', 'if (!response.ok) throw new Error(dashboardErrorMessage(payload.error, "تعذر حفظ الملف"));'),
              ('setError(cause instanceof Error ? cause.message : localizeMessage("تعذر حفظ الملف"));', 'setError(cause instanceof Error ? cause.message : "تعذر حفظ الملف");'),
              ('<p className="mt-3 text-slate-600">{error}</p>', '<p className="mt-3 text-slate-600">{localizeMessage(error)}</p>'),
              ('`}>{error || notice}</div>}', '`}>{error ? localizeMessage(error) : notice}</div>}'),
          ]
          p = Path(path)
          text = p.read_text()
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one ambassador match, got {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)
          p.write_text(text)

          # 2) Storage failures must not block same-tab language synchronization.
          replace_once(
              "src/components/dashboard-i18n-provider.tsx",
              '''  const setLang = useCallback((next: DashboardLang) => {
            setLangState(next);
            window.localStorage.setItem(STORAGE_KEY, next);
            window.dispatchEvent(new CustomEvent(LANGUAGE_EVENT, { detail: { lang: next } }));
          }, []);''',
              '''  const setLang = useCallback((next: DashboardLang) => {
            setLangState(next);
            try {
              window.localStorage.setItem(STORAGE_KEY, next);
            } catch {
              // Keep same-tab language synchronization working even when storage is unavailable.
            }
            window.dispatchEvent(new CustomEvent(LANGUAGE_EVENT, { detail: { lang: next } }));
          }, []);''',
          )

          # 3) A stale health probe must never overwrite a newer POST result.
          replace_once(
              "src/components/site/ai-assistant.tsx",
              '''        setServiceStatus(next === "ready" || next === "limited" || next === "unavailable" ? next : "unavailable");''',
              '''        setServiceStatus((current) => current === "checking"
                  ? (next === "ready" || next === "limited" || next === "unavailable" ? next : "unavailable")
                  : current);''',
          )
          replace_once(
              "src/components/site/ai-assistant.tsx",
              '''      .catch(() => {
                if (!cancelled) setServiceStatus("unavailable");
              });''',
              '''      .catch(() => {
                if (!cancelled) {
                  setServiceStatus((current) => current === "checking" ? "unavailable" : current);
                }
              });''',
          )

          # Extend Group 4 regressions for all review findings.
          test = Path("tests/group-4-ai-health-ambassador-layering.test.mjs")
          text = test.read_text()
          old = 'assert.match(assistant, /aria-live="polite"/);'
          new = '''assert.match(assistant, /aria-live="polite"/);
          assert.match(assistant, /current === "checking"/);
          assert.match(assistant, /current === "checking" \? "unavailable" : current/);'''
          if text.count(old) != 1:
              raise SystemExit("AI review-test insertion point not unique")
          text = text.replace(old, new, 1)

          old = 'assert.match(dashboardProvider, /pathname !== "\\/partner"/);'
          new = '''assert.match(dashboardProvider, /pathname !== "\\/partner"/);
          assert.match(dashboardProvider, /try \{[\s\S]*localStorage\.setItem\(STORAGE_KEY, next\)[\s\S]*\} catch \{[\s\S]*window\.dispatchEvent\(new CustomEvent\(LANGUAGE_EVENT/);'''
          if text.count(old) != 1:
              raise SystemExit("Dashboard storage-test insertion point not unique")
          text = text.replace(old, new, 1)

          old = 'assert.match(ambassador, /throw new Error\\(localizeMessage\\(message\\)\\)/);'
          new = '''assert.match(ambassador, /throw new Error\(message\)/);
          assert.match(ambassador, /error \? localizeMessage\(error\) : notice/);
          assert.match(ambassador, /\{localizeMessage\(error\)\}<\\/p>/);
          assert.doesNotMatch(ambassador, /throw new Error\(localizeMessage/);'''
          if text.count(old) != 1:
              raise SystemExit("Ambassador error-state test insertion point not unique")
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Check diff whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Group 4 regression tests
        run: node tests/group-4-ai-health-ambassador-layering.test.mjs
      - name: Existing AI tests
        run: npm run test:ai
      - name: Existing ambassador delivery tests
        run: npm run test:ambassador-delivery

      - name: Commit validated review fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/group-4-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ambassador/dashboard/page.tsx src/components/dashboard-i18n-provider.tsx src/components/site/ai-assistant.tsx tests/group-4-ai-health-ambassador-layering.test.mjs .github/workflows/group-4-review-fixes.yml
          git commit -m "fix: address group 4 review findings"
          git push origin HEAD:fix/group-4-ai-health-ambassador-layering
