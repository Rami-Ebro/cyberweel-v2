name: Group 1 security validation

on:
  push:
    branches:
      - fix/group-1-payment-submission-security

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Group 1 security regression tests
        run: node --experimental-strip-types --test tests/group-1-payment-submission-security.test.mjs
      - name: Existing AI tests
        run: npm run test:ai
      - name: Existing ambassador delivery tests
        run: npm run test:ambassador-delivery
