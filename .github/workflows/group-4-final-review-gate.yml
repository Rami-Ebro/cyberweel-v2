name: Group 4 final review gate

on:
  push:
    branches:
      - fix/group-4-ai-health-ambassador-layering

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, got {count}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1))

          ambassador = "src/app/ambassador/dashboard/page.tsx"
          for old, new in [
              ('throw new Error(localizeMessage(dashboardErrorMessage(payload.error, "تعذر تحميل لوحة السفير")));', 'throw new Error(dashboardErrorMessage(payload.error, "تعذر تحميل لوحة السفير"));'),
              ('loadDashboard().catch((cause) => setError(cause instanceof Error ? cause.message : localizeMessage("تعذر تحميل البيانات")));', 'loadDashboard().catch((cause) => setError(cause instanceof Error ? cause.message : "تعذر تحميل البيانات"));'),
              ('setError(localizeMessage("تعذر النسخ تلقائيًا. حدّد النص وانسخه يدويًا."));', 'setError("تعذر النسخ تلقائيًا. حدّد النص وانسخه يدويًا.");'),
              ('setError(localizeMessage("تعذرت المشاركة الآن."));', 'setError("تعذرت المشاركة الآن.");'),
              ('throw new Error(localizeMessage(messages[payload?.error] || dashboardErrorMessage(payload?.error, "تعذر إنشاء الرد")));', 'throw new Error(messages[payload?.error] || dashboardErrorMessage(payload?.error, "تعذر إنشاء الرد"));'),
              ('setError(cause instanceof Error ? cause.message : localizeMessage("تعذر إنشاء الرد"));', 'setError(cause instanceof Error ? cause.message : "تعذر إنشاء الرد");'),
              ('throw new Error(localizeMessage(message));', 'throw new Error(message);'),
              ('setError(cause instanceof Error ? cause.message : localizeMessage("تعذر إضافة الإحالة"));', 'setError(cause instanceof Error ? cause.message : "تعذر إضافة الإحالة");'),
              ('if (!response.ok) throw new Error(localizeMessage(dashboardErrorMessage(payload.error, "تعذر حفظ الملف")));', 'if (!response.ok) throw new Error(dashboardErrorMessage(payload.error, "تعذر حفظ الملف"));'),
              ('setError(cause instanceof Error ? cause.message : localizeMessage("تعذر حفظ الملف"));', 'setError(cause instanceof Error ? cause.message : "تعذر حفظ الملف");'),
              ('<p className="mt-3 text-slate-600">{error}</p>', '<p className="mt-3 text-slate-600">{localizeMessage(error)}</p>'),
              ('>{error || notice}</div>', '>{error ? localizeMessage(error) : notice}</div>'),
          ]:
              replace_once(ambassador, old, new)

          provider = "src/components/dashboard-i18n-provider.tsx"
          replace_once(provider,
              '    window.localStorage.setItem(STORAGE_KEY, next);',
              '    try {\n      window.localStorage.setItem(STORAGE_KEY, next);\n    } catch {\n      // Keep same-tab language synchronization working even when storage is unavailable.\n    }')

          assistant = "src/components/site/ai-assistant.tsx"
          replace_once(assistant,
              '        setServiceStatus(next === "ready" || next === "limited" || next === "unavailable" ? next : "unavailable");',
              '        setServiceStatus((current) => current === "checking"\n          ? (next === "ready" || next === "limited" || next === "unavailable" ? next : "unavailable")\n          : current);')
          replace_once(assistant,
              '        if (!cancelled) setServiceStatus("unavailable");',
              '        if (!cancelled) {\n          setServiceStatus((current) => current === "checking" ? "unavailable" : current);\n        }')

          test = "tests/group-4-ai-health-ambassador-layering.test.mjs"
          replace_once(test,
              'assert.match(assistant, /aria-live="polite"/);',
              'assert.match(assistant, /aria-live="polite"/);\nassert.match(assistant, /current === "checking"/);\nassert.match(assistant, /current === "checking" \\? "unavailable" : current/);')
          replace_once(test,
              'assert.match(dashboardProvider, /pathname !== "\\/partner"/);',
              'assert.match(dashboardProvider, /pathname !== "\\/partner"/);\nassert.match(dashboardProvider, /try \\{[\\s\\S]*localStorage\\.setItem\\(STORAGE_KEY, next\\)[\\s\\S]*\\} catch \\{[\\s\\S]*window\\.dispatchEvent\\(new CustomEvent\\(LANGUAGE_EVENT/);')
          replace_once(test,
              'assert.match(ambassador, /throw new Error\\(localizeMessage\\(message\\)\\)/);',
              'assert.match(ambassador, /throw new Error\\(message\\)/);\nassert.match(ambassador, /error \\? localizeMessage\\(error\\) : notice/);\nassert.match(ambassador, /\\{localizeMessage\\(error\\)\\}<\\/p>/);\nassert.doesNotMatch(ambassador, /throw new Error\\(localizeMessage/);')
          PY

      - name: Check diff whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Group 4 regression tests
        run: node tests/group-4-ai-health-ambassador-layering.test.mjs
      - name: Existing AI tests
        run: npm run test:ai
      - name: Existing ambassador delivery tests
        run: npm run test:ambassador-delivery

      - name: Commit validated fixes and remove gate
        shell: bash
        run: |
          rm .github/workflows/group-4-final-review-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ambassador/dashboard/page.tsx src/components/dashboard-i18n-provider.tsx src/components/site/ai-assistant.tsx tests/group-4-ai-health-ambassador-layering.test.mjs .github/workflows/group-4-final-review-gate.yml
          git commit -m "fix: address group 4 review findings"
          git push origin HEAD:fix/group-4-ai-health-ambassador-layering
