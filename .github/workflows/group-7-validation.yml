name: Group 7 validation

on:
  push:
    branches:
      - fix/group-7-admin-ambassadors-mobile-ux

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Group 7 regression
        run: node --test tests/group-7-admin-ambassadors-mobile-ux.test.mjs
      - name: Group 6 regression
        run: node --test tests/group-6-admin-dark-mode-completion.test.mjs
      - name: Group 2 mobile regression
        run: node --test tests/group-2-admin-mobile-ux.test.mjs
