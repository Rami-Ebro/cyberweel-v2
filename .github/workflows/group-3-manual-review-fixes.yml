name: Group 3 manual review fixes validation

on:
  push:
    branches:
      - fix/group-3-public-routing-i18n

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply manual review fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/components/site/use-view-router.ts",
              '''function withCurrentQuery(path: string) {
            if (typeof window === "undefined") return path;
            return `${path}${window.location.search}`;
          }''',
              '''function withCurrentQuery(path: string) {
            if (typeof window === "undefined") return path;
            const params = new URLSearchParams(window.location.search);
            params.delete("path");
            const query = params.toString();
            return query ? `${path}?${query}` : path;
          }''',
          )

          replace_once(
              "src/app/login/page.tsx",
              '<header className="flex items-center justify-between">',
              '<header className="flex flex-wrap items-center justify-between gap-3">',
          )

          test = Path("tests/group-3-public-routing-i18n.test.mjs")
          text = test.read_text()
          old = '''assert.doesNotMatch(router, /window\\.requestAnimationFrame/);'''
          new = '''assert.doesNotMatch(router, /window\\.requestAnimationFrame/);
          assert.match(router, /params\\.delete\\("path"\\)/);'''
          if text.count(old) != 1:
              raise SystemExit("Router regression insertion point not unique")
          text = text.replace(old, new, 1)
          old = '''assert.match(login, /DashboardLanguageButton/);'''
          new = '''assert.match(login, /DashboardLanguageButton/);
          assert.match(login, /flex flex-wrap items-center justify-between gap-3/);'''
          if text.count(old) != 1:
              raise SystemExit("Login regression insertion point not unique")
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Check diff whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Group 3 regression tests
        run: node tests/group-3-public-routing-i18n.test.mjs
      - name: Existing AI tests
        run: npm run test:ai
      - name: Existing ambassador delivery tests
        run: npm run test:ambassador-delivery

      - name: Commit validated fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/group-3-manual-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/site/use-view-router.ts src/app/login/page.tsx tests/group-3-public-routing-i18n.test.mjs .github/workflows/group-3-manual-review-fixes.yml
          git commit -m "fix: close final group 3 manual review findings"
          git push origin HEAD:fix/group-3-public-routing-i18n
