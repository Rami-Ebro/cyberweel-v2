name: Group 2 CodeRabbit fixes validation

on:
  push:
    branches:
      - fix/group-2-admin-mobile-ux

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/group-2-admin-mobile-ux
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply verified CodeRabbit fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Preserve completion for legacy PartnerProject rows while keeping
          # structured stage assignments capped at 99% until a real submission.
          replace_once(
              'src/app/partner/dashboard/page.tsx',
              '  id: string;\n  title: string;',
              '  id: string;\n  projectStageId?: string;\n  title: string;',
          )
          replace_once(
              'src/app/partner/dashboard/page.tsx',
              '''    const progress = progressDrafts[project.id];\n    if (!Number.isInteger(progress) || progress < 0 || progress > 99) {\n      setError("نسبة التقدم اليدوية يجب أن تكون بين 0 و99. عند اكتمال العمل أرسل تسليم المرحلة للمراجعة.");\n      return;\n    }''',
              '''    const progress = progressDrafts[project.id];\n    const structuredAssignment = Boolean(project.projectStageId);\n    const maxProgress = structuredAssignment ? 99 : 100;\n    if (!Number.isInteger(progress) || progress < 0 || progress > maxProgress) {\n      setError(structuredAssignment\n        ? "نسبة التقدم اليدوية يجب أن تكون بين 0 و99. عند اكتمال العمل أرسل تسليم المرحلة للمراجعة."\n        : "نسبة التقدم يجب أن تكون بين 0 و100.");\n      return;\n    }''',
          )
          replace_once(
              'src/app/partner/dashboard/page.tsx',
              '      setNotice(`تم حفظ تقدم «${project.title}» عند ${progress}٪.`);',
              '      setNotice(!project.projectStageId && progress === 100 ? `تم إكمال «${project.title}».` : `تم حفظ تقدم «${project.title}» عند ${progress}٪.`);',
          )
          replace_once(
              'src/app/partner/dashboard/page.tsx',
              '''    const draft = progressDrafts[project.id] ?? project.progress;\n    return (''',
              '''    const draft = progressDrafts[project.id] ?? project.progress;\n    const structuredAssignment = Boolean(project.projectStageId);\n    const maxProgress = structuredAssignment ? 99 : 100;\n    return (''',
          )
          replace_once(
              'src/app/partner/dashboard/page.tsx',
              '''                <input aria-label="نسبة تقدم المشروع" type="range" min={0} max={99} step={1} value={Math.min(99, draft)} onChange={(event) => setProgressDrafts((current) => ({ ...current, [project.id]: Number(event.target.value) }))} className="w-full accent-[#bd9850]" />''',
              '''                <input aria-label="نسبة تقدم المشروع" data-stage-progress={structuredAssignment ? "true" : undefined} type="range" min={0} max={maxProgress} step={1} value={Math.min(maxProgress, draft)} onChange={(event) => setProgressDrafts((current) => ({ ...current, [project.id]: Number(event.target.value) }))} className="w-full accent-[#bd9850]" />''',
          )
          replace_once(
              'src/app/partner/dashboard/page.tsx',
              '''                    <input type="number" min={0} max={99} value={Math.min(99, draft)} onChange={(event) => setProgressDrafts((current) => ({ ...current, [project.id]: Math.max(0, Math.min(99, Number(event.target.value) || 0)) }))} className="w-full bg-transparent text-left font-bold outline-none dark:text-white" />''',
              '''                    <input type="number" data-stage-progress={structuredAssignment ? "true" : undefined} min={0} max={maxProgress} value={Math.min(maxProgress, draft)} onChange={(event) => setProgressDrafts((current) => ({ ...current, [project.id]: Math.max(0, Math.min(maxProgress, Number(event.target.value) || 0)) }))} className="w-full bg-transparent text-left font-bold outline-none dark:text-white" />''',
          )
          replace_once(
              'src/app/partner/dashboard/page.tsx',
              '''                    {savingProjectId === project.id ? "جارٍ الحفظ..." : "حفظ نسبة التقدم"}''',
              '''                    {savingProjectId === project.id ? "جارٍ الحفظ..." : !structuredAssignment && draft === 100 ? "إكمال المشروع" : "حفظ نسبة التقدم"}''',
          )
          replace_once(
              'src/app/partner/dashboard/page.tsx',
              '''                <p className="text-xs leading-6 text-slate-500 dark:text-slate-400">التقدم اليدوي حتى 99٪ فقط. عند اكتمال العمل استخدم «تسليم المرحلة» لإرسال الملاحظة أو الرابط أو الملف إلى مراجعة الإدارة.</p>''',
              '''                <p className="text-xs leading-6 text-slate-500 dark:text-slate-400">{structuredAssignment ? "التقدم اليدوي حتى 99٪ فقط. عند اكتمال العمل استخدم «تسليم المرحلة» لإرسال الملاحظة أو الرابط أو الملف إلى مراجعة الإدارة." : "يمكن تحديث هذا المشروع حتى 100٪؛ عند 100٪ يُسجل كمكتمل وفق مسار المشاريع القديم."}</p>''',
          )

          replace_once(
              'src/app/api/partner/dashboard/route.ts',
              '''  const progress = Number(body?.progress);\n  if (!Number.isInteger(progress) || progress < 0 || progress > 99) return NextResponse.json({ error: "نسبة التقدم اليدوية يجب أن تكون بين 0 و99. عند اكتمال العمل أرسل تسليم المرحلة للمراجعة" }, { status: 400 });\n\n  const stageAssignment = await getStagePartnerAssignment(projectId, user.partner!.id);\n  if (stageAssignment) {''',
              '''  const progress = Number(body?.progress);\n  if (!Number.isInteger(progress) || progress < 0 || progress > 100) return NextResponse.json({ error: "نسبة التقدم يجب أن تكون بين 0 و100" }, { status: 400 });\n\n  const stageAssignment = await getStagePartnerAssignment(projectId, user.partner!.id);\n  if (stageAssignment) {\n    if (progress > 99) return NextResponse.json({ error: "نسبة التقدم اليدوية للإسناد الحديث يجب أن تكون بين 0 و99. عند اكتمال العمل أرسل تسليم المرحلة للمراجعة" }, { status: 400 });''',
          )
          replace_once(
              'src/app/api/partner/dashboard/route.ts',
              '''  const updated = await db.partnerProject.update({ where: { id: project.id }, data: { progress } });\n  return NextResponse.json({ project: serializeLegacyProject(updated) });''',
              '''  const updated = await db.partnerProject.update({\n    where: { id: project.id },\n    data: progress === 100 ? { progress: 100, status: "COMPLETED" } : { progress },\n  });\n  return NextResponse.json({ project: serializeLegacyProject(updated) });''',
          )

          # PartnerDeliveryWorkspace's DOM safety guard must only cap structured
          # stage-assignment controls, not legacy PartnerProject controls.
          replace_once(
              'src/components/partner/partner-delivery-workspace.tsx',
              '''      document.querySelectorAll<HTMLInputElement>('input[aria-label="نسبة تقدم المشروع"]').forEach((input) => {\n        input.max = "99";\n        input.title = "التقدم اليدوي يصل إلى 99٪. الإكمال يتم عبر إرسال تسليم المرحلة.";\n      });\n      document.querySelectorAll<HTMLInputElement>('input[type="number"][max="100"]').forEach((input) => {\n        if (input.closest("main")) input.max = "99";\n      });''',
              '''      document.querySelectorAll<HTMLInputElement>('input[data-stage-progress="true"]').forEach((input) => {\n        input.max = "99";\n        input.title = "التقدم اليدوي يصل إلى 99٪. الإكمال يتم عبر إرسال تسليم المرحلة.";\n      });''',
          )

          # 2) Closed mobile admin drawer must be inert/hidden from accessibility,
          # but the desktop sidebar must stay interactive.
          replace_once(
              'src/components/admin/admin-shell.tsx',
              '  const [menuOpen, setMenuOpen] = useState(false);',
              '  const [menuOpen, setMenuOpen] = useState(false);\n  const [desktopSidebar, setDesktopSidebar] = useState(false);',
          )
          replace_once(
              'src/components/admin/admin-shell.tsx',
              '''  useEffect(() => {\n    queueMicrotask(() => setDarkMode(localStorage.getItem(ADMIN_THEME_KEY) === "dark"));\n  }, []);\n\n  useEffect(() => {\n    if (!menuOpen) return;''',
              '''  useEffect(() => {\n    queueMicrotask(() => setDarkMode(localStorage.getItem(ADMIN_THEME_KEY) === "dark"));\n  }, []);\n\n  useEffect(() => {\n    const media = window.matchMedia("(min-width: 1024px)");\n    const sync = () => {\n      setDesktopSidebar(media.matches);\n      if (media.matches) setMenuOpen(false);\n    };\n    sync();\n    media.addEventListener("change", sync);\n    return () => media.removeEventListener("change", sync);\n  }, []);\n\n  useEffect(() => {\n    if (!menuOpen || desktopSidebar) return;''',
          )
          replace_once(
              'src/components/admin/admin-shell.tsx',
              '  }, [menuOpen]);',
              '  }, [menuOpen, desktopSidebar]);',
          )
          replace_once(
              'src/components/admin/admin-shell.tsx',
              '''        <aside className={`fixed inset-y-0 right-0 z-50 flex w-[min(290px,calc(100vw-1rem))] flex-col overflow-y-auto overscroll-contain bg-[#111827] p-5 text-white shadow-2xl transition-transform lg:sticky lg:top-0 lg:h-screen lg:max-h-screen lg:w-auto lg:translate-x-0 lg:shadow-none ${menuOpen ? "translate-x-0" : "translate-x-full"}`}>''',
              '''        <aside\n          inert={!desktopSidebar && !menuOpen}\n          aria-hidden={!desktopSidebar && !menuOpen ? true : undefined}\n          className={`fixed inset-y-0 right-0 z-50 flex w-[min(290px,calc(100vw-1rem))] flex-col overflow-y-auto overscroll-contain bg-[#111827] p-5 text-white shadow-2xl transition-transform lg:sticky lg:top-0 lg:h-screen lg:max-h-screen lg:w-auto lg:translate-x-0 lg:shadow-none ${menuOpen ? "translate-x-0" : "translate-x-full"}`}\n        >''',
          )

          # Regression coverage for both structured and legacy progress behavior,
          # the scoped delivery guard, and drawer accessibility state.
          t = Path('tests/group-2-admin-mobile-ux.test.mjs')
          tests = t.read_text()
          tests = tests.replace(
              'const partnerApi = read("src/app/api/partner/dashboard/route.ts");',
              'const partnerApi = read("src/app/api/partner/dashboard/route.ts");\nconst partnerDelivery = read("src/components/partner/partner-delivery-workspace.tsx");',
              1,
          )
          old = '''assert.match(adminShell, /const \\[menuOpen, setMenuOpen\\] = useState\\(false\\)/);\nassert.match(adminShell, /aria-label="فتح قائمة الإدارة"/);\nassert.match(adminShell, /fixed inset-y-0 right-0 z-50/);\nassert.match(adminShell, /overflow-y-auto overscroll-contain/);\nassert.match(adminShell, /lg:sticky/);'''
          new = '''assert.match(adminShell, /const \\[menuOpen, setMenuOpen\\] = useState\\(false\\)/);\nassert.match(adminShell, /const \\[desktopSidebar, setDesktopSidebar\\] = useState\\(false\\)/);\nassert.match(adminShell, /matchMedia\\("\\(min-width: 1024px\\)"\\)/);\nassert.match(adminShell, /inert=\\{!desktopSidebar && !menuOpen\\}/);\nassert.match(adminShell, /aria-hidden=\\{!desktopSidebar && !menuOpen \\? true : undefined\\}/);\nassert.match(adminShell, /aria-label="فتح قائمة الإدارة"/);\nassert.match(adminShell, /fixed inset-y-0 right-0 z-50/);\nassert.match(adminShell, /overflow-y-auto overscroll-contain/);\nassert.match(adminShell, /lg:sticky/);'''
          if old not in tests:
              raise SystemExit('admin test block not found')
          tests = tests.replace(old, new, 1)
          old2 = '''assert.match(partner, /max=\\{99\\}/);\nassert.doesNotMatch(partner, /max=\\{100\\}/);\nassert.match(partner, /Math\\.min\\(99/);\nassert.match(partner, /\\["COMPLETED", "REVIEW"\\]\\.includes\\(project\\.status\\)/);\nassert.match(partner, /project\\.status === "REVIEW" \\? "تم إرسال التسليم وهو الآن بانتظار مراجعة الإدارة\\."/);\nassert.match(partnerApi, /progress > 99/);\nassert.doesNotMatch(partnerApi, /progress > 100/);'''
          new2 = '''assert.match(partner, /projectStageId\\?: string/);\nassert.match(partner, /const structuredAssignment = Boolean\\(project\\.projectStageId\\)/);\nassert.match(partner, /const maxProgress = structuredAssignment \\? 99 : 100/);\nassert.match(partner, /data-stage-progress=\\{structuredAssignment \\? "true" : undefined\\}/);\nassert.match(partner, /!structuredAssignment && draft === 100 \\? "إكمال المشروع"/);\nassert.match(partner, /\\["COMPLETED", "REVIEW"\\]\\.includes\\(project\\.status\\)/);\nassert.match(partner, /project\\.status === "REVIEW" \\? "تم إرسال التسليم وهو الآن بانتظار مراجعة الإدارة\\."/);\nassert.match(partnerApi, /progress > 100/);\nassert.match(partnerApi, /if \\(stageAssignment\\) \\{\\n    if \\(progress > 99\\)/);\nassert.match(partnerApi, /data: progress === 100 \\? \\{ progress: 100, status: "COMPLETED" \\} : \\{ progress \\}/);\nassert.match(partnerDelivery, /input\\[data-stage-progress="true"\\]/);\nassert.doesNotMatch(partnerDelivery, /input\\[aria-label="نسبة تقدم المشروع"\\]/);\nassert.doesNotMatch(partnerDelivery, /input\\[type="number"\\]\\[max="100"\\]/);'''
          if old2 not in tests:
              raise SystemExit('partner test block not found')
          t.write_text(tests.replace(old2, new2, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Group 2 regression tests
        run: node tests/group-2-admin-mobile-ux.test.mjs

      - name: Existing AI tests
        run: npm run test:ai

      - name: Existing ambassador delivery tests
        run: npm run test:ambassador-delivery

      - name: Commit validated fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Rami-Ebro"
          git config user.email "ahr17h@gmail.com"
          git rm .github/workflows/group-2-coderabbit-fixes.yml
          git add src tests/group-2-admin-mobile-ux.test.mjs
          git commit -m "fix: address group 2 review findings"
          git push origin HEAD:fix/group-2-admin-mobile-ux
