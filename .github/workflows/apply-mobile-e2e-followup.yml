name: Apply mobile E2E follow-up

on:
  push:
    branches:
      - fix/mobile-e2e-storage-drawer-followup
    paths:
      - .github/workflows/apply-mobile-e2e-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic follow-up patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one marker, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          storage = Path("src/lib/browser-storage.ts")
          storage_text = storage.read_text()
          if "export function readSessionStorage" in storage_text:
              raise SystemExit("session storage helpers already present unexpectedly")
          storage.write_text(storage_text.rstrip() + '''

export function readSessionStorage(key: string): string | null {
  if (typeof window === "undefined") return null;
  try {
    return window.sessionStorage.getItem(key);
  } catch {
    return null;
  }
}

export function writeSessionStorage(key: string, value: string): boolean {
  if (typeof window === "undefined") return false;
  try {
    window.sessionStorage.setItem(key, value);
    return true;
  } catch {
    return false;
  }
}

export function removeSessionStorage(key: string): boolean {
  if (typeof window === "undefined") return false;
  try {
    window.sessionStorage.removeItem(key);
    return true;
  } catch {
    return false;
  }
}
''')

          feedback = "src/components/partner/partner-delivery-feedback.tsx"
          replace_once(
              feedback,
              'import { useEffect, useRef, useState } from "react";\n',
              'import { useEffect, useRef, useState } from "react";\nimport { readSessionStorage, removeSessionStorage, writeSessionStorage } from "@/lib/browser-storage";\n',
          )
          replace_once(
              feedback,
              '      const stored = sessionStorage.getItem(STORAGE_KEY);\n      if (stored) {\n        sessionStorage.removeItem(STORAGE_KEY);\n',
              '      const stored = readSessionStorage(STORAGE_KEY);\n      if (stored) {\n        removeSessionStorage(STORAGE_KEY);\n',
          )
          replace_once(
              feedback,
              '      if (kind === "success") sessionStorage.setItem(STORAGE_KEY, message);\n',
              '      if (kind === "success") writeSessionStorage(STORAGE_KEY, message);\n',
          )

          client = "src/components/client/client-dashboard-parity-tools.tsx"
          replace_once(
              client,
              'import { useRouter } from "next/navigation";\n',
              'import { useRouter } from "next/navigation";\nimport { useDashboardMobileDrawer } from "@/components/dashboard-mobile-drawer";\nimport { readLocalStorage, writeLocalStorage } from "@/lib/browser-storage";\n',
          )
          replace_once(
              client,
              '  const [menuOpen, setMenuOpen] = useState(false);\n  const [loggingOut, setLoggingOut] = useState(false);\n',
              '  const [menuOpen, setMenuOpen] = useState(false);\n  const { desktopSidebar } = useDashboardMobileDrawer(menuOpen, setMenuOpen);\n  const [loggingOut, setLoggingOut] = useState(false);\n',
          )
          replace_once(
              client,
              '    queueMicrotask(() => setDarkMode(localStorage.getItem(CLIENT_THEME_KEY) === "dark"));\n',
              '    queueMicrotask(() => setDarkMode(readLocalStorage(CLIENT_THEME_KEY) === "dark"));\n',
          )
          replace_once(
              client,
              '''  useEffect(() => {
    if (!menuOpen) return;
    const closeOnEscape = (event: KeyboardEvent) => {
      if (event.key === "Escape") setMenuOpen(false);
    };
    document.addEventListener("keydown", closeOnEscape);
    return () => document.removeEventListener("keydown", closeOnEscape);
  }, [menuOpen]);

''',
              '''  useEffect(() => {
    if (!aside) return;
    const drawer = document.querySelector<HTMLElement>('[data-cw-client-aside="true"]');
    if (!drawer) return;
    drawer.id = "client-dashboard-menu";
    const hidden = !desktopSidebar && !menuOpen;
    drawer.inert = hidden;
    drawer.setAttribute("aria-hidden", hidden ? "true" : "false");
    return () => {
      drawer.inert = false;
      drawer.removeAttribute("aria-hidden");
      if (drawer.id === "client-dashboard-menu") drawer.removeAttribute("id");
    };
  }, [aside, desktopSidebar, menuOpen]);

''',
          )
          replace_once(
              client,
              '      localStorage.setItem(CLIENT_THEME_KEY, next ? "dark" : "light");\n',
              '      writeLocalStorage(CLIENT_THEME_KEY, next ? "dark" : "light");\n',
          )
          replace_once(
              client,
              '            aria-label="فتح القائمة"\n            onClick={() => setMenuOpen(true)}\n',
              '            aria-label="فتح القائمة"\n            aria-controls="client-dashboard-menu"\n            aria-expanded={menuOpen}\n            onClick={() => setMenuOpen(true)}\n',
          )

          Path("tests/mobile-e2e-storage-drawer-followup.test.mjs").write_text('''import assert from "node:assert/strict";
import fs from "node:fs";
import test from "node:test";

const read = (path) => fs.readFileSync(path, "utf8");

test("client parity tools use safe storage and expose an accessible mobile drawer", () => {
  const source = read("src/components/client/client-dashboard-parity-tools.tsx");
  assert.ok(source.includes("readLocalStorage(CLIENT_THEME_KEY)"));
  assert.ok(source.includes("writeLocalStorage(CLIENT_THEME_KEY"));
  assert.ok(!source.includes("localStorage."));
  assert.ok(source.includes('aria-controls="client-dashboard-menu"'));
  assert.ok(source.includes("aria-expanded={menuOpen}"));
  assert.ok(source.includes('drawer.id = "client-dashboard-menu"'));
  assert.ok(source.includes("drawer.inert = hidden"));
  assert.ok(source.includes('drawer.setAttribute("aria-hidden"'));
  assert.ok(source.includes("useDashboardMobileDrawer(menuOpen, setMenuOpen)"));
});

test("partner delivery feedback survives blocked session storage", () => {
  const source = read("src/components/partner/partner-delivery-feedback.tsx");
  assert.ok(source.includes("readSessionStorage(STORAGE_KEY)"));
  assert.ok(source.includes("removeSessionStorage(STORAGE_KEY)"));
  assert.ok(source.includes("writeSessionStorage(STORAGE_KEY, message)"));
  assert.ok(!source.includes("sessionStorage."));
});

test("browser storage helpers fail closed for both local and session storage", () => {
  const source = read("src/lib/browser-storage.ts");
  for (const name of ["readLocalStorage", "writeLocalStorage", "readSessionStorage", "writeSessionStorage", "removeSessionStorage"]) {
    assert.ok(source.includes(`export function ${name}(`), `missing ${name}`);
  }
  assert.ok((source.match(/catch \{/g) || []).length >= 5);
});
''')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate

      - name: Run targeted regression tests
        run: node --test tests/mobile-e2e-storage-drawer-followup.test.mjs tests/group-11-dashboard-mobile-storage.test.mjs

      - name: Lint changed application files
        run: ./node_modules/.bin/eslint src/components/client/client-dashboard-parity-tools.tsx src/components/partner/partner-delivery-feedback.tsx src/lib/browser-storage.ts

      - name: TypeScript check
        run: ./node_modules/.bin/tsc --noEmit --incremental false

      - name: Remove temporary workflow and commit reviewed patch
        run: |
          rm .github/workflows/apply-mobile-e2e-followup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/client/client-dashboard-parity-tools.tsx src/components/partner/partner-delivery-feedback.tsx src/lib/browser-storage.ts tests/mobile-e2e-storage-drawer-followup.test.mjs .github/workflows/apply-mobile-e2e-followup.yml
          git commit -m "fix: close mobile E2E storage and client drawer gaps"
          git push origin HEAD:fix/mobile-e2e-storage-drawer-followup
