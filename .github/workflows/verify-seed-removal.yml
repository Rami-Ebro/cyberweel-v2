name: Verify test seed removal

on:
  push:
    branches:
      - chore/remove-unsafe-test-partner-seed

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: AI tests
        run: npm run test:ai
      - name: Ambassador delivery tests
        run: npm run test:ambassador-delivery
