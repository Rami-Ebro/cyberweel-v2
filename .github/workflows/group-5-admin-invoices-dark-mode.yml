name: Group 5 admin invoices dark mode

on:
  push:
    branches:
      - fix/group-5-admin-invoices-dark-mode

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply scoped invoice dark-mode fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/admin/invoices/page.tsx')
          s = p.read_text()
          reps = {
            'className="flex items-center gap-2 rounded-xl border border-[#D8D2C4] bg-white px-4 py-3 font-bold"': 'className="flex items-center gap-2 rounded-xl border border-[#D8D2C4] bg-white px-4 py-3 font-bold dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100"',
            'className="mt-5 rounded-xl bg-emerald-50 p-4 font-bold text-emerald-800"': 'className="mt-5 rounded-xl bg-emerald-50 p-4 font-bold text-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-200"',
            'className="mt-5 rounded-xl bg-rose-50 p-4 font-bold text-rose-800"': 'className="mt-5 rounded-xl bg-rose-50 p-4 font-bold text-rose-800 dark:bg-rose-950/40 dark:text-rose-200"',
            '"bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800"': '"bg-emerald-100 text-emerald-800 dark:bg-emerald-950/50 dark:text-emerald-200" : "bg-rose-100 text-rose-800 dark:bg-rose-950/50 dark:text-rose-200"',
            'className="whitespace-nowrap rounded-lg border border-emerald-300 bg-emerald-50 px-2 py-1 text-[10px] font-black text-emerald-800 disabled:opacity-40"': 'className="whitespace-nowrap rounded-lg border border-emerald-300 bg-emerald-50 px-2 py-1 text-[10px] font-black text-emerald-800 disabled:opacity-40 dark:border-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-200"',
            'className="rounded-full bg-rose-50 px-2.5 py-1 text-[10px] font-black text-rose-700"': 'className="rounded-full bg-rose-50 px-2.5 py-1 text-[10px] font-black text-rose-700 dark:bg-rose-950/40 dark:text-rose-200"',
            'className="mt-4 w-full rounded-xl border border-emerald-300 bg-emerald-50 px-4 py-2.5 font-black text-emerald-800 disabled:opacity-40"': 'className="mt-4 w-full rounded-xl border border-emerald-300 bg-emerald-50 px-4 py-2.5 font-black text-emerald-800 disabled:opacity-40 dark:border-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-200"',
            'className="max-h-[calc(100dvh-2rem)] w-full max-w-xl overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl sm:p-6"': 'className="max-h-[calc(100dvh-2rem)] w-full max-w-xl overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl sm:p-6 dark:bg-slate-900 dark:text-slate-100"',
            'className="mt-2 text-sm leading-6 text-slate-600"': 'className="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300"',
            'className="rounded-lg p-2 text-slate-500 hover:bg-slate-100 disabled:opacity-40"': 'className="rounded-lg p-2 text-slate-500 hover:bg-slate-100 disabled:opacity-40 dark:text-slate-400 dark:hover:bg-slate-800"',
            'className="mt-5 rounded-xl bg-[#F7F3EB] p-4"': 'className="mt-5 rounded-xl bg-[#F7F3EB] p-4 dark:bg-slate-800"',
            'className="mt-1 text-sm text-slate-600"': 'className="mt-1 text-sm text-slate-600 dark:text-slate-300"',
            'className="rounded-xl border border-slate-300 bg-white px-5 py-3 font-black disabled:opacity-40"': 'className="rounded-xl border border-slate-300 bg-white px-5 py-3 font-black disabled:opacity-40 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100"',
            '<style jsx global>{`.field{width:100%;border-radius:.75rem;border:1px solid #d8d2c4;padding:.75rem 1rem;background:white}`}</style>': '<style jsx global>{`.field{width:100%;border-radius:.75rem;border:1px solid #d8d2c4;padding:.75rem 1rem;background:white}[data-admin-shell-root="true"].dark .field{border-color:#334155;background:#0f172a;color:#f8fafc;color-scheme:dark}[data-admin-shell-root="true"].dark .field::placeholder{color:#94a3b8}[data-admin-shell-root="true"].dark select.field option{background:#0f172a;color:#f8fafc}`}</style>',
          }
          for old, new in reps.items():
            if old not in s:
              raise SystemExit(f'missing expected pattern: {old[:90]}')
            s = s.replace(old, new)
          p.write_text(s)
          PY

          cat > tests/group-5-admin-invoices-dark-mode.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const page = fs.readFileSync("src/app/admin/invoices/page.tsx", "utf8");

          assert.match(page, /dark:bg-emerald-950\/40 dark:text-emerald-200/);
          assert.match(page, /dark:bg-rose-950\/40 dark:text-rose-200/);
          assert.match(page, /dark:bg-emerald-950\/50 dark:text-emerald-200/);
          assert.match(page, /dark:bg-rose-100 text-rose-800|dark:bg-rose-950\/50 dark:text-rose-200/);
          assert.match(page, /dark:bg-slate-900 dark:text-slate-100/);
          assert.match(page, /\[data-admin-shell-root="true"\]\.dark \.field\{border-color:#334155;background:#0f172a;color:#f8fafc;color-scheme:dark\}/);
          assert.match(page, /\.dark \.field::placeholder\{color:#94a3b8\}/);
          assert.match(page, /\.dark select\.field option\{background:#0f172a;color:#f8fafc\}/);
          assert.doesNotMatch(page, /\.field\{[^}]*background:white\}`}/);

          console.log("Group 5 admin invoice dark-mode checks passed.");
          EOF
      - name: Check diff whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Group 5 regression
        run: node --test tests/group-5-admin-invoices-dark-mode.test.mjs
      - name: Existing Group 2 regression
        run: node --test tests/group-2-admin-mobile-ux.test.mjs
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/group-5-admin-invoices-dark-mode.yml
          git add src/app/admin/invoices/page.tsx tests/group-5-admin-invoices-dark-mode.test.mjs
          git commit -m "fix: complete admin invoice dark mode"
          git push
