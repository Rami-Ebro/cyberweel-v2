name: Apply Group 10 admin shell parity

on:
  push:
    branches:
      - fix/group10-admin-shell-parity
    paths:
      - scripts/group10-apply.py
      - .github/workflows/group10-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/group10-admin-shell-parity
          fetch-depth: 0
      - name: Verify expected base ancestry
        run: git merge-base --is-ancestor 98efeca772b8380d55748c13932977c054cbab94 HEAD
      - name: Apply deterministic patch
        run: python3 scripts/group10-apply.py
      - name: Verify patch whitespace
        run: git diff --check
      - name: Remove temporary applicator
        run: rm scripts/group10-apply.py .github/workflows/group10-apply.yml
      - name: Commit clean Group 10 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Group 10: unify admin shell parity"
          git push origin HEAD:fix/group10-admin-shell-parity
