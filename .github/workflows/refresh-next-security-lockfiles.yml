name: Refresh Next security lockfiles

on:
  push:
    branches:
      - fix/final-security-seo-audit
    paths:
      - .github/workflows/refresh-next-security-lockfiles.yml

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-security-seo-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update npm lockfile to patched Next.js
        run: npm install next@16.3.3 --save-exact --package-lock-only --ignore-scripts

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Update Bun lockfile to patched Next.js
        run: bun add next@16.3.3 --exact --ignore-scripts

      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json bun.lock
          if git diff --cached --quiet; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git commit -m "fix(security): upgrade Next.js to 16.3.3"
          git push origin HEAD:fix/final-security-seo-audit
