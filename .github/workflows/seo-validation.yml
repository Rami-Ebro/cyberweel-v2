name: Temporary SEO validation

on:
  push:
    branches:
      - chore/seo-foundation-hardening

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ai
      - run: npm run test:ambassador-delivery
      - run: npm run build
