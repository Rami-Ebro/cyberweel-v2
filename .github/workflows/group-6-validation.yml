name: Group 6 validation

on:
  push:
    branches:
      - fix/group-6-admin-dark-mode-completion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Group 6 regression first
        shell: bash
        run: |
          set +e
          node --test tests/group-6-admin-dark-mode-completion.test.mjs > group6-validation-output.txt 2>&1
          code=$?
          cat group6-validation-output.txt
          if [ "$code" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add group6-validation-output.txt
            git commit -m "chore: capture group 6 validation output [skip ci]"
            git push
            exit "$code"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Group 5 regression
        run: node --test tests/group-5-admin-invoices-dark-mode.test.mjs
      - name: Group 6 regression
        run: node --test tests/group-6-admin-dark-mode-completion.test.mjs
      - name: AI regression
        run: npm run test:ai
      - name: Ambassador delivery regression
        run: npm run test:ambassador-delivery
