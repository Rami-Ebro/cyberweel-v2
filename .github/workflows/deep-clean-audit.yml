name: Deep clean repository verification

on:
  push:
    branches:
      - chore/deep-clean-public-env-audit

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Audit env and public assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')
          text_suffixes = {'.ts','.tsx','.mjs','.js','.cjs','.json','.md','.css','.scss','.html','.txt','.prisma','.yml','.yaml','.webmanifest'}
          ignored_parts = {'.git','node_modules','.next'}
          text_files = []
          for p in root.rglob('*'):
              if not p.is_file() or any(part in ignored_parts for part in p.parts):
                  continue
              if p.suffix.lower() in text_suffixes or p.name in {'.env.example','.gitignore'}:
                  try:
                      text_files.append((p, p.read_text(encoding='utf-8')))
                  except UnicodeDecodeError:
                      pass

          env_path = Path('.env.example')
          env_text = env_path.read_text(encoding='utf-8')
          env_keys = re.findall(r'(?m)^([A-Z][A-Z0-9_]*)=', env_text)
          env_refs = set()
          patterns = [
              re.compile(r'process\.env\.([A-Z][A-Z0-9_]*)'),
              re.compile(r'process\.env\[["\']([A-Z][A-Z0-9_]*)["\']\]'),
              re.compile(r'env\(["\']([A-Z][A-Z0-9_]*)["\']\)'),
          ]
          for path, text in text_files:
              if path == env_path:
                  continue
              for pattern in patterns:
                  env_refs.update(pattern.findall(text))
          print('ENV_UNUSED_DOCUMENTED=', sorted(set(env_keys) - env_refs))

          public = Path('public')
          public_files = [p for p in public.rglob('*') if p.is_file()]
          by_hash = {}
          for p in public_files:
              by_hash.setdefault(hashlib.sha256(p.read_bytes()).hexdigest(), []).append(str(p))
          print('PUBLIC_DUPLICATES=', [paths for paths in by_hash.values() if len(paths) > 1])
          for p in sorted(public_files, key=lambda x: str(x)):
              route = '/' + p.relative_to(public).as_posix()
              refs = [str(path) for path, text in text_files if path != p and route in text]
              print(f'PUBLIC {p.relative_to(public).as_posix()} bytes={p.stat().st_size} exact_refs={len(refs)} files={refs[:10]}')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: AI tests
        run: npm run test:ai

      - name: Ambassador delivery tests
        run: npm run test:ambassador-delivery
