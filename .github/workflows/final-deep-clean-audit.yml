name: Final deep-clean closeout

on:
  push:
    branches:
      - chore/final-deep-clean-audit

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove final unused direct dependencies and historical one-off script
        shell: bash
        run: |
          npm uninstall cmdk date-fns --package-lock-only --ignore-scripts --no-audit --no-fund

          python - <<'PY'
          from pathlib import Path
          p=Path('package.json')
          text=p.read_text(encoding='utf-8')
          target='    "db:migrate:resolve-smart-links": "prisma migrate resolve --applied 20260704184924_init_smart_links && prisma migrate resolve --applied 20260713110839_init_smart_links",\n'
          if target in text:
              text=text.replace(target,'')
          p.write_text(text,encoding='utf-8')
          PY

          if grep -R --line-number -E "from ['\"](cmdk|date-fns)(/|['\"])|require\(['\"](cmdk|date-fns)" src tests scripts 2>/dev/null; then
            echo 'Removed dependency still has a direct source reference.' >&2
            exit 1
          fi
          if grep -n 'db:migrate:resolve-smart-links' package.json; then
            echo 'Historical resolve script still present.' >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: AI tests
        run: npm run test:ai

      - name: Ambassador delivery tests
        run: npm run test:ambassador-delivery

      - name: Confirm source graph is still fully reachable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          ROOT=Path('.').resolve(); SRC=ROOT/'src'; EXTS=['.ts','.tsx','.js','.jsx','.mjs','.cjs']
          mods={p.resolve():p for p in SRC.rglob('*') if p.is_file() and p.suffix in EXTS}
          pats=[re.compile(r'(?:import|export)\s+(?:[^;]*?\s+from\s+)?["\']([^"\']+)["\']'),re.compile(r'import\(\s*["\']([^"\']+)["\']\s*\)'),re.compile(r'require\(\s*["\']([^"\']+)["\']\s*\)')]
          def res(src,s):
            if s.startswith('@/'): b=SRC/s[2:]
            elif s.startswith('.'): b=src.parent/s
            else:return None
            cs=[b]
            if b.suffix=='': cs += [Path(str(b)+e) for e in EXTS]+[b/('index'+e) for e in EXTS]
            for c in cs:
              if c.resolve() in mods:return c.resolve()
            return None
          edges={x:set() for x in mods}; unresolved=[]
          for rp,p in mods.items():
            t=p.read_text(); specs=[]
            for pat in pats:specs+=pat.findall(t)
            for s in specs:
              if s.startswith('@/') or s.startswith('.'):
                d=res(p,s)
                if d:edges[rp].add(d)
                elif not s.endswith('.css'):unresolved.append((str(p),s))
          roots=set(); nn={'page.tsx','page.ts','layout.tsx','layout.ts','route.ts','route.tsx','loading.tsx','error.tsx','not-found.tsx','template.tsx','default.tsx'}
          for rp,p in mods.items():
            rel=p.relative_to(ROOT).as_posix()
            if rel=='src/proxy.ts' or (rel.startswith('src/app/') and p.name in nn):roots.add(rp)
          for base_name in ['tests','scripts']:
            base=ROOT/base_name
            if not base.exists():continue
            for p in base.rglob('*'):
              if not(p.is_file() and p.suffix in EXTS):continue
              t=p.read_text(); specs=[]
              for pat in pats:specs+=pat.findall(t)
              for s in specs:
                if s.startswith('@/'):
                  d=res(SRC/'dummy.ts',s)
                  if d:roots.add(d)
                elif '/src/' in s or s.startswith('../src/') or s.startswith('./src/'):
                  bp=p.parent/s
                  for c in [bp]+[Path(str(bp)+e) for e in EXTS]:
                    if c.resolve() in mods:roots.add(c.resolve());break
          seen=set(); stack=list(roots)
          while stack:
            x=stack.pop()
            if x in seen:continue
            seen.add(x);stack.extend(edges[x])
          dead=[mods[x].relative_to(ROOT).as_posix() for x in mods if x not in seen]
          print(f'modules={len(mods)} reachable={len(seen)} dead={len(dead)} unresolved={len(unresolved)}')
          if dead or unresolved:
            print('dead=',dead);print('unresolved=',unresolved);raise SystemExit(1)
          PY

      - name: Commit verified closeout cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No closeout cleanup changes to commit."
            exit 0
          fi
          git commit -m "chore: remove final unused dependencies and historical migration helper"
          git push origin HEAD:${{ github.ref_name }}
