name: Group 3 public routing and i18n validation v4

on:
  push:
    branches:
      - fix/group-3-public-routing-i18n

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply stable Group 3 patch
        run: python scripts/group3_public_routing_i18n_patch.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Group 3 regression tests
        run: node tests/group-3-public-routing-i18n.test.mjs

      - name: Existing AI tests
        run: npm run test:ai

      - name: Existing ambassador delivery tests
        run: npm run test:ambassador-delivery

      - name: Commit validated fixes and remove temporary tooling
        shell: bash
        run: |
          rm .github/workflows/group-3-public-routing-i18n.yml
          rm .github/workflows/group-3-public-routing-i18n-v2.yml
          rm .github/workflows/group-3-public-routing-i18n-v3.yml
          rm .github/workflows/group-3-public-routing-i18n-v4.yml
          rm scripts/group3_public_routing_i18n_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/site/use-view-router.ts src/components/site/i18n.tsx src/lib/dashboard-i18n.ts src/components/dashboard-i18n-provider.tsx src/app/login/page.tsx src/components/sections/partner-view.tsx src/components/sections/collaboration-application-form.tsx tests/group-3-public-routing-i18n.test.mjs .github/workflows/group-3-public-routing-i18n.yml .github/workflows/group-3-public-routing-i18n-v2.yml .github/workflows/group-3-public-routing-i18n-v3.yml .github/workflows/group-3-public-routing-i18n-v4.yml scripts/group3_public_routing_i18n_patch.py
          git commit -m "fix: close group 3 public routing and language findings"
          git push origin HEAD:fix/group-3-public-routing-i18n
