name: Fix React hooks lint debt

on:
  push:
    branches:
      - chore/fix-react-hooks-lint-debt

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused hook fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              if new in text:
                  return
              raise SystemExit(f"Expected snippet not found in {path}: {old[:80]!r}")

          # 1) Admin execution plan: load on details toggle, not from an effect.
          path = "src/components/admin/project-execution-plan.tsx"
          replace(path,
              'import { FormEvent, type ReactNode, useEffect, useMemo, useState } from "react";',
              'import { FormEvent, type ReactNode, useMemo, useState } from "react";')
          replace(path,
              '  useEffect(() => { if (open && !loaded) void loadStages(); }, [open, loaded]);',
              '  function handleOpenChange(nextOpen: boolean) {\n    setOpen(nextOpen);\n    if (nextOpen && !loaded) void loadStages();\n  }')
          replace(path,
              '<details open={open} onToggle={(event) => setOpen(event.currentTarget.open)} className="group mt-2 rounded-xl border border-[#D8D2C4] bg-white">',
              '<details open={open} onToggle={(event) => handleOpenChange(event.currentTarget.open)} className="group mt-2 rounded-xl border border-[#D8D2C4] bg-white">')

          # 2) Stage-partner assignments: same event-driven loading pattern.
          path = "src/components/admin/stage-partner-assignment-manager.tsx"
          replace(path,
              'import { FormEvent, useEffect, useMemo, useState } from "react";',
              'import { FormEvent, useMemo, useState } from "react";')
          replace(path,
              '  useEffect(() => {\n    if (open && !data) void load();\n  }, [open, data]);',
              '  function handleOpenChange(nextOpen: boolean) {\n    setOpen(nextOpen);\n    if (nextOpen && !data) void load();\n  }')
          replace(path,
              '<details open={open} onToggle={(event) => setOpen(event.currentTarget.open)} className="group mt-2 rounded-xl border border-[#D8D2C4] bg-white">',
              '<details open={open} onToggle={(event) => handleOpenChange(event.currentTarget.open)} className="group mt-2 rounded-xl border border-[#D8D2C4] bg-white">')

          # 3) Ambassador header: hydrate local seen state and initial fetch asynchronously.
          path = "src/components/ambassador/ambassador-header-tools.tsx"
          replace(path,
              '    setSeenIds(storedSeenIds());',
              '    queueMicrotask(() => setSeenIds(storedSeenIds()));')
          replace(path,
              '  useEffect(() => {\n    void loadNotifications();\n  }, []);',
              '  useEffect(() => {\n    queueMicrotask(() => void loadNotifications());\n  }, []);')

          # 4) Partner header: remove synchronous effect state writes while keeping legacy migration.
          path = "src/components/partner/partner-header-tools.tsx"
          replace(path,
              '  const [seenReady, setSeenReady] = useState(false);\n',
              '')
          replace(path,
              '    setSeenIds(storedSeenIds());\n    setSeenReady(true);',
              '    queueMicrotask(() => setSeenIds(storedSeenIds()));')
          replace(path,
              '  useEffect(() => {\n    void loadNotifications();\n  }, []);',
              '  useEffect(() => {\n    queueMicrotask(() => void loadNotifications());\n  }, []);')
          replace(path,
              '    if (!seenReady || !notifications.length || localStorage.getItem(SEEN_IDS_KEY)) return;',
              '    if (!notifications.length || localStorage.getItem(SEEN_IDS_KEY)) return;')
          replace(path,
              '    setSeenIds(migrated);\n    localStorage.setItem(SEEN_IDS_KEY, JSON.stringify(migrated));\n  }, [notifications, seenReady]);',
              '    queueMicrotask(() => {\n      setSeenIds(migrated);\n      localStorage.setItem(SEEN_IDS_KEY, JSON.stringify(migrated));\n    });\n  }, [notifications]);')

          # 5) Client parity tools: DOM root is mutable external state, so keep it in a ref.
          path = "src/components/client/client-dashboard-parity-tools.tsx"
          replace(path,
              'import { useEffect, useState } from "react";',
              'import { useEffect, useRef, useState } from "react";')
          replace(path,
              '  const [root, setRoot] = useState<HTMLElement | null>(null);',
              '  const rootRef = useRef<HTMLElement | null>(null);')
          replace(path,
              '      setRoot(marked.root);',
              '      rootRef.current = marked.root;')
          replace(path,
              '  useEffect(() => {\n    if (!root) return;\n    root.dataset.cwClientMenuOpen = menuOpen ? "true" : "false";\n  }, [menuOpen, root]);',
              '  useEffect(() => {\n    const root = rootRef.current;\n    if (!root) return;\n    root.dataset.cwClientMenuOpen = menuOpen ? "true" : "false";\n  }, [menuOpen, controls]);')
          replace(path,
              '  useEffect(() => {\n    if (!root) return;\n    root.classList.toggle("dark", darkMode);\n    root.dataset.cwClientTheme = darkMode ? "dark" : "light";\n  }, [darkMode, root]);',
              '  useEffect(() => {\n    const root = rootRef.current;\n    if (!root) return;\n    root.classList.toggle("dark", darkMode);\n    root.dataset.cwClientTheme = darkMode ? "dark" : "light";\n  }, [darkMode, controls]);')

          # 6) Partner delivery feedback: restore stored success after the effect turn.
          path = "src/components/partner/partner-delivery-feedback.tsx"
          replace(path,
              '    const stored = sessionStorage.getItem(STORAGE_KEY);\n    if (stored) {\n      sessionStorage.removeItem(STORAGE_KEY);\n      setFeedback({ kind: "success", message: stored });\n      lastMessage.current = stored;\n    }',
              '    queueMicrotask(() => {\n      const stored = sessionStorage.getItem(STORAGE_KEY);\n      if (stored) {\n        sessionStorage.removeItem(STORAGE_KEY);\n        setFeedback({ kind: "success", message: stored });\n        lastMessage.current = stored;\n      }\n    });')

          # 7) Partner delivery workspace: hydration-safe mounted signal and event-driven data load.
          path = "src/components/partner/partner-delivery-workspace.tsx"
          replace(path,
              'import { FormEvent, useEffect, useMemo, useState } from "react";',
              'import { FormEvent, useEffect, useMemo, useState, useSyncExternalStore } from "react";')
          replace(path,
              'export function PartnerDeliveryWorkspace() {\n  const [mounted, setMounted] = useState(false);',
              'const subscribeToMount = () => () => {};\n\nexport function PartnerDeliveryWorkspace() {\n  const mounted = useSyncExternalStore(subscribeToMount, () => true, () => false);')
          replace(path,
              '  useEffect(() => setMounted(true), []);\n\n',
              '')
          replace(path,
              '  useEffect(() => {\n    if (open) void load();\n  }, [open]);\n\n',
              '')
          replace(path,
              '<button type="button" onClick={() => setOpen(true)} className="fixed bottom-6 left-6 z-[80] inline-flex items-center gap-2 rounded-2xl bg-[#111827] px-5 py-3.5 text-sm font-black text-white shadow-2xl transition hover:bg-[#9f7d3d]">',
              '<button type="button" onClick={() => { setOpen(true); void load(); }} className="fixed bottom-6 left-6 z-[80] inline-flex items-center gap-2 rounded-2xl bg-[#111827] px-5 py-3.5 text-sm font-black text-white shadow-2xl transition hover:bg-[#9f7d3d]">')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: AI tests
        run: npm run test:ai

      - name: Ambassador delivery tests
        run: npm run test:ambassador-delivery

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/project-execution-plan.tsx \
            src/components/admin/stage-partner-assignment-manager.tsx \
            src/components/ambassador/ambassador-header-tools.tsx \
            src/components/client/client-dashboard-parity-tools.tsx \
            src/components/partner/partner-delivery-feedback.tsx \
            src/components/partner/partner-delivery-workspace.tsx \
            src/components/partner/partner-header-tools.tsx
          if git diff --cached --quiet; then
            echo "No hook fixes to commit."
            exit 0
          fi
          git commit -m "chore: resolve React hooks lint debt"
          git push origin HEAD:${{ github.ref_name }}
