name: Group 11 deterministic apply

on:
  push:
    branches:
      - fix/group11-dashboard-mobile-storage

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Group 11 patch
        run: node scripts/group11-apply.mjs
      - name: Verify clean patch
        run: git diff --check
      - name: Remove temporary patch tooling
        run: rm -f scripts/group11-apply.mjs .github/workflows/group11-apply.yml
      - name: Commit Group 11 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Group 11: harden dashboard mobile and storage"
          git push origin HEAD:fix/group11-dashboard-mobile-storage
