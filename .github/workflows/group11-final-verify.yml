name: Group 11 final verification

on:
  push:
    branches:
      - fix/group11-dashboard-mobile-storage

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cyberweel_test
      ADMIN_SESSION_SECRET: group11-final-verification-secret-1234567890
      AUTH_SECRET: group11-final-auth-secret-12345678901234567890
      RATE_LIMIT_SECRET: group11-final-rate-limit-secret-1234567890
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/prisma generate
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npm run lint
      - run: ./node_modules/.bin/tsc --noEmit --incremental false
      - run: ./node_modules/.bin/next build
      - run: git diff --check 4492ed2e4a8880ff7ac91daa37740b1fd05c03ac...HEAD
