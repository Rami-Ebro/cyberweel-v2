name: Apply invoice payment date fix

on:
  push:
    branches:
      - fix/group-1-payment-submission-security
    paths:
      - .github/workflows/apply-invoice-payment-date-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/group-1-payment-submission-security
      - name: Replace UTC default with DateInput local default
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/admin/invoices/page.tsx')
          text = path.read_text()
          old = '<DateInput name="paidAt" required defaultValue={new Date().toISOString().slice(0, 10)} className="field font-normal" />'
          new = '<DateInput name="paidAt" required className="field font-normal" />'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit exact fix
        run: |
          git config user.name "Rami-Ebro"
          git config user.email "ahr17h@gmail.com"
          git add src/app/admin/invoices/page.tsx
          git diff --cached --check
          git commit -m "fix: use local payment date default"
          git push origin HEAD:fix/group-1-payment-submission-security
