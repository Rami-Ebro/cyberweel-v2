name: Group 11 mobile visual E2E

on:
  push:
    branches:
      - test/mobile-e2e-group11

permissions:
  contents: read

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyberweel_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cyberweel_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cyberweel_e2e
      AUTH_SECRET: group11-mobile-e2e-auth-secret-12345678901234567890
      NEXTAUTH_SECRET: group11-mobile-e2e-nextauth-secret-1234567890123456
      ADMIN_SESSION_SECRET: group11-mobile-e2e-admin-secret-123456789012345
      RATE_LIMIT_SECRET: group11-mobile-e2e-rate-secret-123456789012345678
      PARTNER_ADMIN_KEY: group11-mobile-e2e-admin-key
      E2E_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact follow-up application diff for E2E only
        run: |
          git fetch origin main fix/mobile-e2e-client-partner-storage
          git diff origin/main..origin/fix/mobile-e2e-client-partner-storage -- \
            src/components/client/client-dashboard-parity-tools.tsx \
            src/components/partner/partner-delivery-feedback.tsx \
            src/lib/browser-storage.ts \
            tests/group-11-mobile-e2e-followup.test.mjs > /tmp/mobile-followup.patch
          git apply --check /tmp/mobile-followup.patch
          git apply /tmp/mobile-followup.patch
          git diff --check
          git status --short

      - name: Strengthen notification viewport assertion for E2E
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/e2e-mobile-visual.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const before = '  assertNoRootOverflow(await pageMetrics(page), `client-${width}-notifications-open`);\n  await page.screenshot({ path: path.join(ARTIFACT_DIR, `client-${width}-notifications.png`), fullPage: true });';
          const after = '  assertNoRootOverflow(await pageMetrics(page), `client-${width}-notifications-open`);\n  const dialogBox = await dialog.boundingBox();\n  const viewportWidth = await page.evaluate(() => window.innerWidth);\n  requireCondition(Boolean(dialogBox), `client-${width}: notification dialog has no bounding box`);\n  requireCondition(dialogBox.x >= -1, `client-${width}: notification dialog starts outside viewport (${dialogBox.x}px)`);\n  requireCondition(dialogBox.x + dialogBox.width <= viewportWidth + 1, `client-${width}: notification dialog ends outside viewport (${dialogBox.x + dialogBox.width}px > ${viewportWidth}px)`);\n  await page.screenshot({ path: path.join(ARTIFACT_DIR, `client-${width}-notifications.png`), fullPage: true });';
          if (!source.includes(before)) throw new Error('notification assertion marker not found');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate

      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0

      - name: Install Chromium and system dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Initialize isolated PostgreSQL from current schema
        run: ./node_modules/.bin/prisma db push --skip-generate

      - name: Seed representative isolated dashboard data
        run: node scripts/e2e-mobile-seed.mjs

      - name: Build exact application tree
        run: ./node_modules/.bin/next build

      - name: Start application
        run: |
          ./node_modules/.bin/next start -H 127.0.0.1 -p 3000 > /tmp/cyberweel-mobile-e2e-server.log 2>&1 &
          echo $! > /tmp/cyberweel-mobile-e2e-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:3000/login > /dev/null; then
              echo "CyberWeel E2E server is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cyberweel-mobile-e2e-server.log
          exit 1

      - name: Run 16 authenticated viewport sessions plus blocked-storage checks
        run: node scripts/e2e-mobile-visual.mjs

      - name: Preserve server log
        if: always()
        run: |
          mkdir -p artifacts/mobile-e2e
          cp /tmp/cyberweel-mobile-e2e-server.log artifacts/mobile-e2e/server.log || true

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group11-mobile-e2e-artifacts
          path: artifacts/mobile-e2e/
          if-no-files-found: warn
          retention-days: 7
