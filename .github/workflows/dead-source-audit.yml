name: Remove and verify dead source modules

on:
  push:
    branches:
      - chore/remove-dead-source-modules

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove proven dead modules and duplicate toast stack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dead = [
            'src/app/admin/login/actions.ts',
            'src/app/admin/login/login-form.tsx',
            'src/app/admin/smart-links/logout-button.tsx',
            'src/components/sections/home-view.tsx',
            'src/components/sections/how-we-help-areas.tsx',
            'src/components/sections/how-we-help-delivery.tsx',
            'src/components/sections/how-we-help-honesty.tsx',
            'src/components/sections/how-we-help-process.tsx',
            'src/components/sections/how-we-help-view.tsx',
            'src/components/sections/transition-section.tsx',
            'src/components/site/breadcrumb-ld.tsx',
            'src/components/site/command-palette.tsx',
            'src/components/site/fade-in.tsx',
            'src/components/site/section-reading-bar.tsx',
            'src/components/views/contact-view.tsx',
            'src/components/views/how-we-help-view.tsx',
            'src/hooks/use-mobile.ts',
            'src/components/ui/toast.tsx',
            'src/components/ui/toaster.tsx',
            'src/hooks/use-toast.ts',
          ]
          for name in dead:
              p=Path(name)
              if p.exists():
                  p.unlink()

          layout=Path('src/app/layout.tsx')
          text=layout.read_text(encoding='utf-8')
          text=text.replace('import { Toaster } from "@/components/ui/toaster";\n','')
          text=text.replace('        <Toaster />\n','')
          layout.write_text(text,encoding='utf-8')
          PY

          npm uninstall @radix-ui/react-toast --package-lock-only --ignore-scripts --no-audit --no-fund

          if grep -R --line-number --fixed-strings '@radix-ui/react-toast' src package.json 2>/dev/null; then
            echo 'Radix toast reference remains after cleanup.' >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: AI tests
        run: npm run test:ai

      - name: Ambassador delivery tests
        run: npm run test:ambassador-delivery

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "chore: remove dead source modules and duplicate toast stack"
          git push origin HEAD:${{ github.ref_name }}
