name: Group 2 admin mobile UX validation Node 24

on:
  push:
    branches:
      - fix/group-2-admin-mobile-ux

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/group-2-admin-mobile-ux
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply the exact Group 2 patch from the first workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/group-2-admin-mobile-ux.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/group2.py').write_text(code)
          exec(compile(code, '/tmp/group2.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Group 2 regression tests
        run: node tests/group-2-admin-mobile-ux.test.mjs

      - name: Existing AI tests
        run: npm run test:ai

      - name: Existing ambassador delivery tests
        run: npm run test:ambassador-delivery

      - name: Commit validated fixes and remove temporary workflows
        shell: bash
        run: |
          git config user.name "Rami-Ebro"
          git config user.email "ahr17h@gmail.com"
          git rm .github/workflows/group-2-admin-mobile-ux.yml .github/workflows/group-2-admin-mobile-ux-node24.yml
          git add src tests/group-2-admin-mobile-ux.test.mjs
          git commit -m "fix: complete group 2 admin mobile UX"
          git push origin HEAD:fix/group-2-admin-mobile-ux
