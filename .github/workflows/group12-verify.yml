name: Group 12 verification

on:
  push:
    branches:
      - fix/group12-account-settings-hardening

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/cyberweel_test
      ADMIN_SESSION_SECRET: group12-verification-secret-only-1234567890
      RATE_LIMIT_SECRET: group12-rate-limit-secret-only-1234567890
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/prisma generate
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npm run lint
      - run: ./node_modules/.bin/tsc --noEmit --incremental false
      - run: ./node_modules/.bin/next build
      - run: git diff --check d179e3b2c73629a0792d199b9c87d737b1f53cc2...HEAD
