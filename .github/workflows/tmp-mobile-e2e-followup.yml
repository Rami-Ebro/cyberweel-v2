name: Temporary mobile E2E follow-up patch

on:
  push:
    branches:
      - fix/mobile-e2e-client-partner-storage

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-e2e-client-partner-storage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/apply-mobile-e2e-followup.mjs
      - name: Commit clean application patch
        run: |
          git config user.name "Rami-Ebro"
          git config user.email "ahr17h@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden client mobile drawer and partner storage"
          git push origin HEAD:fix/mobile-e2e-client-partner-storage
