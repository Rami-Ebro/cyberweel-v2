name: Group 3 public routing and i18n validation

on:
  push:
    branches:
      - fix/group-3-public-routing-i18n

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply Group 3 fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # CW-C01 + CW-C04: route-entry scroll and legacy ambassador hash normalization.
          path = "src/components/site/use-view-router.ts"
          replace_once(path,
          '''function parseLegacyHash(): ViewId | null {
            if (typeof window === "undefined") return null;
            const raw = window.location.hash.replace(/^#\\/?/, "").trim();
            return Object.prototype.hasOwnProperty.call(PUBLIC_VIEW_PATHS, raw) ? (raw as ViewId) : null;
          }''',
          '''function legacyHashTarget(): string | null {
            if (typeof window === "undefined") return null;
            const raw = window.location.hash.replace(/^#\\/?/, "").trim();
            if (raw === "ambassador") {
              const params = new URLSearchParams(window.location.search);
              params.set("path", "ambassador");
              return `/partner?${params.toString()}`;
            }
            return Object.prototype.hasOwnProperty.call(PUBLIC_VIEW_PATHS, raw)
              ? publicViewPath(raw as ViewId, window.location.search)
              : null;
          }''')
          replace_once(path,
          '''  useEffect(() => {
              const legacyView = parseLegacyHash();
              if (!legacyView) return;

              router.replace(publicViewPath(legacyView, window.location.search), { scroll: false });
            }, [router]);''',
          '''  useEffect(() => {
              const legacyTarget = legacyHashTarget();
              if (legacyTarget) {
                router.replace(legacyTarget, { scroll: false });
                return;
              }
              window.scrollTo({ top: 0, behavior: "auto" });
            }, [pathname, router]);''')
          replace_once(path,
          '''      router.push(target, { scroll: false });
              window.requestAnimationFrame(() => {
                window.scrollTo({ top: 0, behavior: "auto" });
              });''',
          '''      router.push(target, { scroll: false });''')

          # CW-C03: deterministic Arabic first render, then restore the saved language after hydration.
          path = "src/components/site/i18n.tsx"
          replace_once(path,
          '''  const [lang, setLangState] = useState<Lang>(() => {
              if (typeof window === "undefined") return "ar";
              try {
                const stored = localStorage.getItem(STORAGE_KEY) as Lang | null;
                if (stored === "ar" || stored === "en") return stored;
              } catch {
                // ignore
              }
              return "ar";
            });''',
          '''  const [lang, setLangState] = useState<Lang>("ar");

            useEffect(() => {
              try {
                const stored = localStorage.getItem(STORAGE_KEY) as Lang | null;
                if (stored === "ar" || stored === "en") setLangState(stored);
              } catch {
                // Keep the deterministic Arabic first render when storage is unavailable.
              }
            }, []);''')

          # CW-C02 + CW-C05: do not let the dashboard DOM translator own the public /partner page;
          # and do not render a floating language button over the login footer.
          path = "src/components/dashboard-i18n-provider.tsx"
          replace_once(path,
          '''function isDashboardPath(pathname: string) {
            return ["/admin", "/client", "/partner", "/ambassador", "/account", "/login", "/complete-profile", "/dashboard"].some(
              (prefix) => pathname === prefix || pathname.startsWith(`${prefix}/`),
            );
          }''',
          '''function isDashboardPath(pathname: string) {
            if (pathname === "/partner") return false;
            return ["/admin", "/client", "/partner", "/ambassador", "/account", "/login", "/complete-profile", "/dashboard"].some(
              (prefix) => pathname === prefix || pathname.startsWith(`${prefix}/`),
            );
          }''')
          replace_once(path,
          '''      {active && !pathname.startsWith("/admin") && !pathname.startsWith("/client") && !pathname.startsWith("/partner/dashboard") ? (
                <DashboardLanguageButton className="fixed bottom-5 left-5 z-[100] h-11 shadow-lg" />
              ) : null}''',
          '''      {active && pathname !== "/login" && !pathname.startsWith("/admin") && !pathname.startsWith("/client") && !pathname.startsWith("/partner/dashboard") ? (
                <DashboardLanguageButton className="fixed bottom-5 left-5 z-[100] h-11 shadow-lg" />
              ) : null}''')

          # CW-C05 + CW-C06: place language switch in the login header and use the clean collaboration URL.
          path = "src/app/login/page.tsx"
          replace_once(path,
          '''import { dashboardErrorMessage } from "@/lib/dashboard-labels";''',
          '''import { dashboardErrorMessage } from "@/lib/dashboard-labels";
          import { DashboardLanguageButton } from "@/components/dashboard-i18n-provider";''')
          replace_once(path,
          '''          <Link href="/" className="inline-flex items-center gap-2 text-sm font-bold text-slate-500 transition hover:text-[#111827]">
                    العودة إلى الموقع
                    <ArrowLeft className="h-4 w-4" />
                  </Link>''',
          '''          <div className="flex items-center gap-2">
                    <DashboardLanguageButton className="h-10 px-3 shadow-none" />
                    <Link href="/" className="inline-flex items-center gap-2 text-sm font-bold text-slate-500 transition hover:text-[#111827]">
                      العودة إلى الموقع
                      <ArrowLeft className="h-4 w-4" />
                    </Link>
                  </div>''')
          replace_once(path, 'href="/#/partner"', 'href="/partner"')

          # Clean share URLs can target the correct collaboration path directly.
          path = "src/components/sections/partner-view.tsx"
          replace_once(path,
          '''import { useState } from "react";''',
          '''import { useEffect, useState } from "react";''')
          replace_once(path,
          '''  const [active, setActive] = useState<PathId | null>(null);



            return (''',
          '''  const [active, setActive] = useState<PathId | null>(null);

            useEffect(() => {
              const requestedPath = new URLSearchParams(window.location.search).get("path");
              if (requestedPath === "partner" || requestedPath === "ambassador") setActive(requestedPath);
            }, []);

            return (''')

          # CW-C02: make the execution-partner wizard genuinely bilingual while preserving Arabic backend values.
          path = "src/components/sections/collaboration-application-form.tsx"
          replace_once(path,
          '''const educationLevels = ["الثانوية أو أقل", "دبلوم", "بكالوريوس", "ماجستير", "دكتوراه", "تدريب مهني / شهادة تخصصية", "أخرى"];

          function CheckGroup({ name, options, step }: { name: string; options: string[]; step: number }) {
            return <div className="grid gap-2 sm:grid-cols-2">{options.map((option) => <label key={option} className="flex cursor-pointer items-center gap-3 rounded-xl border bg-white p-3"><input data-step={step} type="checkbox" name={name} value={option} className="size-4 accent-ink" /><span>{option}</span></label>)}</div>;
          }''',
          '''const educationLevels = ["الثانوية أو أقل", "دبلوم", "بكالوريوس", "ماجستير", "دكتوراه", "تدريب مهني / شهادة تخصصية", "أخرى"];

          const partnerEnglish: Record<string, string> = {
            "البرمجة والتطوير": "Programming & Development",
            "التصميم وتجربة المستخدم": "Design & User Experience",
            "التسويق الرقمي": "Digital Marketing",
            "تحليل الأعمال": "Business Analysis",
            "الذكاء الاصطناعي والأتمتة": "AI & Automation",
            "إدارة المشاريع": "Project Management",
            "صناعة المحتوى": "Content Creation",
            "مواقع ومتاجر إلكترونية": "Websites & Online Stores",
            "تطبيقات": "Applications",
            "أتمتة وذكاء اصطناعي": "Automation & AI",
            "تصميم وهوية": "Design & Branding",
            "تسويق ومحتوى": "Marketing & Content",
            "دعم تقني": "Technical Support",
            "تحليل واستشارات": "Analysis & Consulting",
            "شام كاش": "Sham Cash",
            "حوالة مالية": "Money Transfer",
            "تحويل بنكي": "Bank Transfer",
            "أخرى": "Other",
            "الثانوية أو أقل": "High School or Below",
            "دبلوم": "Diploma",
            "بكالوريوس": "Bachelor's Degree",
            "ماجستير": "Master's Degree",
            "دكتوراه": "Doctorate",
            "تدريب مهني / شهادة تخصصية": "Professional Training / Specialist Certificate",
            "البيانات الأساسية": "Basic Information",
            "معلومات العمل": "Work Information",
            "القدرة والتفرغ": "Capacity & Availability",
            "نبذة قصيرة": "Short Bio",
            "معلومات الدفع": "Payment Information",
            "تقدم التسجيل": "Application Progress",
            "الاسم الكامل": "Full Name",
            "البريد الإلكتروني": "Email Address",
            "رقم الهاتف": "Phone Number",
            "العمر": "Age",
            "الدولة / المنطقة": "Country / Region",
            "نوع الشريك": "Partner Type",
            "فرد مستقل": "Independent Professional",
            "فريق أو شركة": "Team or Company",
            "مستشار متخصص": "Specialist Consultant",
            "مجال العمل": "Work Area",
            "الخدمات أو المجالات التي تستطيع دعمها": "Services or Areas You Can Support",
            "المستوى التعليمي / الشهادة": "Education Level / Certificate",
            "اكتب المستوى التعليمي أو الشهادة": "Enter Your Education Level or Certificate",
            "التخصص (إن وجد)": "Specialization (if any)",
            "مستوى الخبرة": "Experience Level",
            "مبتدئ": "Beginner",
            "متوسط": "Intermediate",
            "متقدم": "Advanced",
            "خبير": "Expert",
            "عدد سنوات الخبرة": "Years of Experience",
            "نوع التفرغ": "Availability Type",
            "متفرغ بالكامل": "Full-Time",
            "متفرغ جزئياً": "Part-Time",
            "عدد الساعات المتاحة أسبوعياً": "Available Hours per Week",
            "نبذة قصيرة عنك أو عن خبرتك": "A Short Bio About You or Your Experience",
            "(اختياري)": "(optional)",
            "طرق الدفع المعتمدة": "Available Payment Methods",
            "اكتب طريقة الدفع الأخرى": "Enter the Other Payment Method",
            "يرجى إكمال الحقول المطلوبة في هذه المرحلة والتأكد من صحة البيانات.": "Please complete the required fields in this step and verify the information.",
            "اختر طريقة دفع واحدة على الأقل.": "Choose at least one payment method.",
            "السابق": "Previous",
            "التالي": "Next",
            "جارٍ الإرسال...": "Submitting...",
            "إرسال الطلب للمراجعة": "Submit for Review",
          };

          function partnerText(value: string, arabic: boolean) {
            return arabic ? value : partnerEnglish[value] || value;
          }

          function CheckGroup({ name, options, step, arabic }: { name: string; options: string[]; step: number; arabic: boolean }) {
            return <div className="grid gap-2 sm:grid-cols-2">{options.map((option) => <label key={option} className="flex cursor-pointer items-center gap-3 rounded-xl border bg-white p-3"><input data-step={step} type="checkbox" name={name} value={option} className="size-4 accent-ink" /><span>{partnerText(option, arabic)}</span></label>)}</div>;
          }''')
          replace_once(path,
          '''        setErrorMessage("يرجى إكمال الحقول المطلوبة في هذه المرحلة والتأكد من صحة البيانات.");''',
          '''        setErrorMessage(partnerText("يرجى إكمال الحقول المطلوبة في هذه المرحلة والتأكد من صحة البيانات.", arabic));''')
          replace_once(path,
          '''      setErrorMessage("اختر طريقة دفع واحدة على الأقل.");''',
          '''      setErrorMessage(partnerText("اختر طريقة دفع واحدة على الأقل.", arabic));''')
          replace_once(path,
          '''    setErrorMessage(arabic
                ? dashboardErrorMessage(result?.message, "تعذر إرسال الطلب. حاول مرة أخرى.")
                : result?.message || "The application could not be submitted. Please try again.");''',
          '''    setErrorMessage(arabic
                ? dashboardErrorMessage(result?.message, "تعذر إرسال الطلب. حاول مرة أخرى.")
                : "The application could not be submitted. Please try again.");''')
          replace_once(path, 'const url = `${window.location.origin}/#/partner`;', 'const url = `${window.location.origin}/partner?path=partner`;')
          replace_once(path, 'const url = `${window.location.origin}/#/ambassador`;', 'const url = `${window.location.origin}/partner?path=ambassador`;')
          replace_once(path,
          '''  const titles = ["البيانات الأساسية", "معلومات العمل", "القدرة والتفرغ", "نبذة قصيرة", "معلومات الدفع"];''',
          '''  const titles = ["البيانات الأساسية", "معلومات العمل", "القدرة والتفرغ", "نبذة قصيرة", "معلومات الدفع"].map((value) => partnerText(value, arabic));''')
          replace_once(path, 'aria-label="تقدم التسجيل"', 'aria-label={partnerText("تقدم التسجيل", arabic)}')
          replacements = {
            'placeholder="الاسم الكامل"': 'placeholder={partnerText("الاسم الكامل", arabic)}',
            'placeholder="البريد الإلكتروني"': 'placeholder={partnerText("البريد الإلكتروني", arabic)}',
            'placeholder="رقم الهاتف"': 'placeholder={partnerText("رقم الهاتف", arabic)}',
            'placeholder="العمر"': 'placeholder={partnerText("العمر", arabic)}',
            'placeholder="الدولة / المنطقة"': 'placeholder={partnerText("الدولة / المنطقة", arabic)}',
            '<option value="" disabled>نوع الشريك</option><option>فرد مستقل</option><option>فريق أو شركة</option><option>مستشار متخصص</option>': '<option value="" disabled>{partnerText("نوع الشريك", arabic)}</option><option value="فرد مستقل">{partnerText("فرد مستقل", arabic)}</option><option value="فريق أو شركة">{partnerText("فريق أو شركة", arabic)}</option><option value="مستشار متخصص">{partnerText("مستشار متخصص", arabic)}</option>',
            '<h4 className="mb-2 font-black">مجال العمل</h4><CheckGroup name="workAreas" options={workAreas} step={2} />': '<h4 className="mb-2 font-black">{partnerText("مجال العمل", arabic)}</h4><CheckGroup name="workAreas" options={workAreas} step={2} arabic={arabic} />',
            '<h4 className="mb-2 font-black">الخدمات أو المجالات التي تستطيع دعمها</h4><CheckGroup name="supportServices" options={services} step={2} />': '<h4 className="mb-2 font-black">{partnerText("الخدمات أو المجالات التي تستطيع دعمها", arabic)}</h4><CheckGroup name="supportServices" options={services} step={2} arabic={arabic} />',
            '<option value="" disabled>المستوى التعليمي / الشهادة</option>{educationLevels.map((value) => <option key={value}>{value}</option>)}': '<option value="" disabled>{partnerText("المستوى التعليمي / الشهادة", arabic)}</option>{educationLevels.map((value) => <option key={value} value={value}>{partnerText(value, arabic)}</option>)}',
            'placeholder="اكتب المستوى التعليمي أو الشهادة"': 'placeholder={partnerText("اكتب المستوى التعليمي أو الشهادة", arabic)}',
            'placeholder="التخصص (إن وجد)"': 'placeholder={partnerText("التخصص (إن وجد)", arabic)}',
            '<option value="" disabled>مستوى الخبرة</option>{["مبتدئ", "متوسط", "متقدم", "خبير"].map((v) => <option key={v}>{v}</option>)}': '<option value="" disabled>{partnerText("مستوى الخبرة", arabic)}</option>{["مبتدئ", "متوسط", "متقدم", "خبير"].map((v) => <option key={v} value={v}>{partnerText(v, arabic)}</option>)}',
            'placeholder="عدد سنوات الخبرة"': 'placeholder={partnerText("عدد سنوات الخبرة", arabic)}',
            '<option value="" disabled>نوع التفرغ</option><option value="FULL_TIME">متفرغ بالكامل</option><option value="PART_TIME">متفرغ جزئياً</option>': '<option value="" disabled>{partnerText("نوع التفرغ", arabic)}</option><option value="FULL_TIME">{partnerText("متفرغ بالكامل", arabic)}</option><option value="PART_TIME">{partnerText("متفرغ جزئياً", arabic)}</option>',
            'placeholder="عدد الساعات المتاحة أسبوعياً"': 'placeholder={partnerText("عدد الساعات المتاحة أسبوعياً", arabic)}',
            'نبذة قصيرة عنك أو عن خبرتك <span className="font-normal text-muted-foreground">(اختياري)</span>': '{partnerText("نبذة قصيرة عنك أو عن خبرتك", arabic)} <span className="font-normal text-muted-foreground">{partnerText("(اختياري)", arabic)}</span>',
            '<h4 className="font-black">طرق الدفع المعتمدة</h4>': '<h4 className="font-black">{partnerText("طرق الدفع المعتمدة", arabic)}</h4>',
            '<CheckGroup name="paymentMethods" options={payments} step={5} />': '<CheckGroup name="paymentMethods" options={payments} step={5} arabic={arabic} />',
            'placeholder="اكتب طريقة الدفع الأخرى"': 'placeholder={partnerText("اكتب طريقة الدفع الأخرى", arabic)}',
            '{errorMessage || "يرجى إكمال الحقول المطلوبة في هذه المرحلة والتأكد من صحة البيانات."}': '{errorMessage || partnerText("يرجى إكمال الحقول المطلوبة في هذه المرحلة والتأكد من صحة البيانات.", arabic)}',
            '>السابق</button>': '>{partnerText("السابق", arabic)}</button>',
            '>التالي</button>': '>{partnerText("التالي", arabic)}</button>',
            '{state === "sending" ? "جارٍ الإرسال..." : "إرسال الطلب للمراجعة"}': '{state === "sending" ? partnerText("جارٍ الإرسال...", arabic) : partnerText("إرسال الطلب للمراجعة", arabic)}',
            '<p className="text-red-700 sm:col-span-2">تعذر إرسال الطلب.</p>': '<p className="text-red-700 sm:col-span-2">{arabic ? "تعذر إرسال الطلب." : "The application could not be submitted."}</p>',
          }
          p = Path(path)
          text = p.read_text()
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one form match, got {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)
          p.write_text(text)

          # Regression checks for the exact audit findings.
          Path("tests/group-3-public-routing-i18n.test.mjs").write_text(r'''import assert from "node:assert/strict";
          import fs from "node:fs";

          const read = (path) => fs.readFileSync(path, "utf8");
          const router = read("src/components/site/use-view-router.ts");
          const publicI18n = read("src/components/site/i18n.tsx");
          const dashboardI18n = read("src/components/dashboard-i18n-provider.tsx");
          const login = read("src/app/login/page.tsx");
          const partnerView = read("src/components/sections/partner-view.tsx");
          const form = read("src/components/sections/collaboration-application-form.tsx");

          assert.match(router, /if \(raw === "ambassador"\)/);
          assert.match(router, /params\.set\("path", "ambassador"\)/);
          assert.match(router, /window\.scrollTo\(\{ top: 0, behavior: "auto" \}\)/);
          assert.match(router, /\[pathname, router\]/);
          assert.doesNotMatch(router, /window\.requestAnimationFrame/);

          assert.match(publicI18n, /useState<Lang>\("ar"\)/);
          assert.match(publicI18n, /localStorage\.getItem\(STORAGE_KEY\)/);
          assert.match(publicI18n, /if \(stored === "ar" \|\| stored === "en"\) setLangState\(stored\)/);
          assert.doesNotMatch(publicI18n, /useState<Lang>\(\(\) =>/);

          assert.match(dashboardI18n, /if \(pathname === "\/partner"\) return false/);
          assert.match(dashboardI18n, /pathname !== "\/login"/);

          assert.match(login, /DashboardLanguageButton/);
          assert.match(login, /href="\/partner"/);
          assert.doesNotMatch(login, /\/#\/partner/);

          assert.match(partnerView, /requestedPath === "partner" \|\| requestedPath === "ambassador"/);
          assert.match(form, /const partnerEnglish: Record<string, string>/);
          assert.match(form, /CheckGroup name="workAreas" options=\{workAreas\} step=\{2\} arabic=\{arabic\}/);
          assert.match(form, /partnerText\("السابق", arabic\)/);
          assert.match(form, /partnerText\("التالي", arabic\)/);
          assert.match(form, /\/partner\?path=partner/);
          assert.match(form, /\/partner\?path=ambassador/);
          assert.doesNotMatch(form, /\/#\/partner/);
          assert.doesNotMatch(form, /\/#\/ambassador/);

          console.log("Group 3 public routing/i18n regression checks passed.");
          ''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Group 3 regression tests
        run: node tests/group-3-public-routing-i18n.test.mjs

      - name: Existing AI tests
        run: npm run test:ai

      - name: Existing ambassador delivery tests
        run: npm run test:ambassador-delivery

      - name: Commit validated fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/group-3-public-routing-i18n.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/site/use-view-router.ts src/components/site/i18n.tsx src/components/dashboard-i18n-provider.tsx src/app/login/page.tsx src/components/sections/partner-view.tsx src/components/sections/collaboration-application-form.tsx tests/group-3-public-routing-i18n.test.mjs .github/workflows/group-3-public-routing-i18n.yml
          git commit -m "fix: close group 3 public routing and language findings"
          git push origin HEAD:fix/group-3-public-routing-i18n
