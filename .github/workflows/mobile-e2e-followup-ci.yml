name: Mobile E2E follow-up verification

on:
  push:
    branches:
      - test/mobile-e2e-followup-ci

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://cyberweel:cyberweel@127.0.0.1:65432/cyberweel_ci
      AUTH_SECRET: mobile-e2e-followup-auth-secret-12345678901234567890
      NEXTAUTH_SECRET: mobile-e2e-followup-nextauth-secret-1234567890123456
      ADMIN_SESSION_SECRET: mobile-e2e-followup-admin-secret-123456789012345
      RATE_LIMIT_SECRET: mobile-e2e-followup-rate-secret-123456789012345678
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate
      - name: Run full test suite
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: ./node_modules/.bin/tsc --noEmit --incremental false
      - name: Direct Next build
        run: ./node_modules/.bin/next build
      - name: Diff check
        run: git diff --check
