name: Group 8 Validation

on:
  push:
    branches:
      - fix/group-8-protected-dashboard-route-guard

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Next build
        run: npx next build
      - name: Group 8 route guard regression
        run: node --test tests/group-8-protected-dashboard-route-guard.test.mjs
      - name: Group 7 mobile regression
        run: node --test tests/group-7-admin-ambassadors-mobile-ux.test.mjs
      - name: Group 6 dark mode regression
        run: node --test tests/group-6-admin-dark-mode-completion.test.mjs
      - name: Group 3 public routing regression
        run: node --test tests/group-3-public-routing-i18n.test.mjs
