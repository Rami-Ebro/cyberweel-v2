name: Group 11 client notifications accessibility fix

on:
  push:
    branches:
      - fix/group11-dashboard-mobile-storage

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact accessibility alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          client_path = Path('src/components/client-dashboard.tsx')
          client = client_path.read_text()
          old_button = '<button type="button" aria-expanded={notificationsOpen} aria-haspopup="dialog" onClick={() => setNotificationsOpen((value) => !value)} className="relative flex items-center justify-center gap-2 rounded-xl border border-[#D8D2C4] bg-white px-4 py-3 font-bold shadow-sm">'
          new_button = '<button type="button" aria-expanded={notificationsOpen} aria-haspopup="dialog" aria-controls="client-notifications-popover" onClick={() => setNotificationsOpen((value) => !value)} className="relative flex items-center justify-center gap-2 rounded-xl border border-[#D8D2C4] bg-white px-4 py-3 font-bold shadow-sm">'
          old_popup = '<div className="absolute left-0 top-full z-20 mt-3 w-[min(92vw,28rem)] rounded-2xl border border-[#D8D2C4] bg-white p-3 shadow-xl">'
          new_popup = '<div id="client-notifications-popover" role="dialog" aria-label="إشعارات العميل" className="absolute left-0 top-full z-20 mt-3 w-[min(92vw,28rem)] rounded-2xl border border-[#D8D2C4] bg-white p-3 shadow-xl">'
          if client.count(old_button) != 1:
              raise SystemExit(f'client notification button marker count={client.count(old_button)}')
          if client.count(old_popup) != 1:
              raise SystemExit(f'client notification popup marker count={client.count(old_popup)}')
          client = client.replace(old_button, new_button).replace(old_popup, new_popup)
          client_path.write_text(client)

          test_path = Path('tests/group-11-dashboard-mobile-storage.test.mjs')
          test = test_path.read_text()
          marker = '  assert.match(client, /min-w-\\[900px\\]/);\n\n  const partner = read("src/app/partner/dashboard/page.tsx");'
          replacement = '  assert.match(client, /min-w-\\[900px\\]/);\n  assert.match(client, /aria-controls="client-notifications-popover"/);\n  assert.match(client, /id="client-notifications-popover" role="dialog" aria-label="إشعارات العميل"/);\n\n  const partner = read("src/app/partner/dashboard/page.tsx");'
          if test.count(marker) != 1:
              raise SystemExit(f'Group 11 test marker count={test.count(marker)}')
          test_path.write_text(test.replace(marker, replacement))
          PY
      - run: git diff --check
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/group11-client-notifications-a11y.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Group 11: align client notification dialog semantics"
          git push origin HEAD:fix/group11-dashboard-mobile-storage
