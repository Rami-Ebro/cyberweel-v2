name: Group 10 verification

on:
  push:
    branches:
      - fix/group10-admin-shell-parity
    paths:
      - .github/workflows/group10-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/cyberweel_test
      ADMIN_SESSION_SECRET: group10-verification-secret-only-1234567890
      AUTH_SECRET: group10-auth-secret-only-12345678901234567890
      RATE_LIMIT_SECRET: group10-rate-limit-secret-only-1234567890
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/prisma generate
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npm run lint
      - run: ./node_modules/.bin/tsc --noEmit --incremental false
      - run: ./node_modules/.bin/next build
      - run: git diff --check 98efeca772b8380d55748c13932977c054cbab94...HEAD

# rerun after Group 10 regression-test alignment
